name: Weekly CGC Data Update

on:
  schedule:
    # 11:00 UTC = 7:00 AM EDT (Wed = 3, Thu = 4, Fri = 5)
    - cron: '0 11 * * 3,4,5'
  workflow_dispatch:

concurrency:
  group: weekly-cgc-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CGC_Analyzer/requirements.txt

      - name: Run Data Ingestion
        run: |
          python CGC_Analyzer/run_report.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add CGC_Analyzer/gsw_data/

          if git diff --cached --quiet; then
            echo "No data changes detected. Skipping commit and push."
            exit 0
          fi

          echo "Changes detected. Committing..."
          git commit -m "Auto-update CGC weekly data [skip ci]"

          # Make sure we are up to date with remote before pushing
          git fetch origin main

          if ! git rebase origin/main; then
            echo "Rebase failed – falling back to merge"
            git rebase --abort || true
            git merge --no-edit origin/main
          fi

          git push origin main
