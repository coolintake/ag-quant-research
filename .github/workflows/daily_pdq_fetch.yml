name: Daily PDQ Price Fetch

on:
  schedule:
    # 00:00 UTC = 8:00 PM EDT / 7:00 PM EST the previous evening. UTC days
    # Tue-Sat (2-6) are Mon-Fri evenings in Canada, so every weekday's PDQ
    # close is captured. A UTC Mon-Fri schedule would fire on Sunday evening
    # and miss Friday.
    - cron: '0 0 * * 2-6'
  workflow_dispatch:

concurrency:
  group: daily-pdq-fetch
  cancel-in-progress: false

jobs:
  fetch-pdq:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Canada_Crop_Prices

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Canada_Crop_Prices/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch PDQ Prices
        env:
          PDQ_API_KEY: ${{ secrets.PDQ_API_KEY }}
        run: |
          if [ -z "$PDQ_API_KEY" ]; then
            echo "::error::Repository secret PDQ_API_KEY is not set."
            exit 1
          fi
          python ingest.py --fetch-pdq

      - name: Commit and Push Raw Snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # Only the raw JSON lake is versioned; DuckDB and Parquet are
          # rebuilt locally with `python ingest.py --reload-raw`.
          git add data/raw/

          if git diff --cached --quiet; then
            echo "No new PDQ snapshot (PDQ has not published a new import). Skipping commit."
            exit 0
          fi

          git commit -m "Auto-update PDQ raw price snapshot [skip ci]"

          # Make sure we are up to date with remote before pushing
          git fetch origin main

          if ! git rebase origin/main; then
            echo "Rebase failed – falling back to merge"
            git rebase --abort || true
            git merge --no-edit origin/main
          fi

          git push origin HEAD:main
